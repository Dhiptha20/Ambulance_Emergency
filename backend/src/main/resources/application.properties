# ============================================================
# AmbulanceDispatch Spring Boot Configuration
# ============================================================

server.port=8080

# Application Name
spring.application.name=ambulance-dispatch

# MySQL Database Configuration
# You can set DB_PASSWORD and DB_USERNAME environment variables or update below directly
spring.datasource.url=jdbc:mysql://localhost:3306/ambulance_dispatch?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:dhiptha@2007}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Swagger / OpenAPI UI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Logging
logging.level.com.example.ambulancedispatch=INFO
logging.level.org.hibernate.SQL=DEBUG
